# eduroam-userid.conf — FreeRADIUS 3.0/3.2 snippets for radius_userid.py
#
# These are fragments to merge into your existing virtual servers, not a
# drop-in site. Three things are being arranged:
#
#   1. accounting is written where the bridge can read it       (all sites)
#   2. the *inner* (real) identity survives into accounting     (IdP only)
#   3. the NAS keeps reporting the client's IP address          (all sites)
#
# ==========================================================================
# 1. Feed the bridge
# ==========================================================================
#
# In the accounting section of the virtual server your APs talk to
# (sites-enabled/default, or your eduroam site):

#	accounting {
#		detail			# your existing accounting
#		detail_userid		# add this: the bridge's feed
#		...
#	}

# ==========================================================================
# 2. Carry the inner identity out to accounting                (IdP side)
# ==========================================================================
#
# The problem: with PEAP/TTLS the client sends an anonymous outer identity
# (anonymous@uni.fi) and only reveals the real one inside the TLS tunnel.
# The NAS never sees the tunnel, so its accounting says "anonymous@uni.fi"
# — useless for firewall policy.
#
# The fix: hand the NAS an opaque Class attribute in the Access-Accept. RFC
# 2865 §5.25 requires the NAS to echo Class back in every accounting packet
# for that session, so the real name comes back to us untouched. It is more
# reliable than rewriting User-Name, because it does not depend on the NAS
# honouring a User-Name in the Accept, and it leaves your logs' outer
# identity alone.
#
# In the INNER tunnel server (sites-enabled/inner-tunnel, or
# eduroam-inner-tunnel), post-auth section — stash the inner name where the
# outer server can reach it:

#	post-auth {
#		update {
#			&outer.session-state:Tmp-String-0 := "%{User-Name}"
#		}
#		...
#	}

# In the OUTER server (the one the APs talk to), post-auth section — put it
# into the reply as a Class attribute with the "uid:" marker the bridge
# looks for (--class-prefix):

#	post-auth {
#		if (&session-state:Tmp-String-0) {
#			update reply {
#				&Class := "uid:%{session-state:Tmp-String-0}"
#			}
#		}
#		...
#	}

# Non-tunnelled methods (EAP-TLS, or plain PAP against a local database)
# have no inner tunnel: User-Name is already the real name and the bridge
# uses it as-is. If you want Class set for those sessions too:
#
#		if (!&session-state:Tmp-String-0 && &User-Name) {
#			update reply {
#				&Class := "uid:%{User-Name}"
#			}
#		}
#
# Prefer base64 if your identities can contain awkward bytes — the bridge
# accepts both forms and picks by the "64:" marker:
#
#			&Class := "uid:64:%{base64:%{session-state:Tmp-String-0}}"
#
# Note that base64 is not protection: Class travels to the AP in clear text,
# same as the plain form. Both disclose the identity to your own NAS, which
# already handled the user's traffic. Neither discloses anything about
# visitors from other institutions — see the privacy notes in
# docs/palo-alto-user-id.md.

# ==========================================================================
# 3. Make sure an IP address actually arrives
# ==========================================================================
#
# Wireless NASes commonly send the Accounting-Start before the client has
# finished DHCP, so Framed-IP-Address is absent or 0.0.0.0. Ask for interim
# updates in post-auth so the address arrives shortly after — and so a
# long-lived mapping keeps being refreshed:

#	post-auth {
#		update reply {
#			Acct-Interim-Interval := 600
#		}
#	}

# UniFi also has to be told to send accounting at all:
#   Settings -> Profiles -> RADIUS -> your profile
#     * Accounting enabled, port 1813
#     * "Enable Accounting Updates" / interim interval set
# If your controller still never fills in Framed-IP-Address, run the bridge
# with --unifi-host/--unifi-user so it can resolve the client MAC from
# Calling-Station-Id to an IP via the controller's client table.

# ==========================================================================
# 4. Optional: Chargeable-User-Identity
# ==========================================================================
#
# If you already run CUI (rlm_cui) and its value is a real identity rather
# than an opaque hash, the bridge can use it as a fallback with
# --cui-as-user. It is a fallback only: Class and User-Name are tried first.
